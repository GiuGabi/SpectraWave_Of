<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPECTRAWAVE - Análise e Criptografia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Fira+Code:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* PALETA ABELHA: Preto (#0a0a0a), Amarelo Vibrante (#FFD600), Branco para contraste */
        :root {
            --bg-dark: #050505;
            --bee-yellow: #FFD600;
            --bee-yellow-glow: rgba(255, 214, 0, 0.4);
            --math-faded: rgba(255, 214, 0, 0.15);
            --math-faded-white: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--bg-dark);
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* CONTAINER DA CAPA (TELA INTEIRA) */
        .slide {
            width: 100%;
            height: 100%;
            position: relative;
            background-color: var(--bg-dark);
            display: flex;
        }

        /* TEXTURA DE FAVO DE MEL */
        .hex-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='103.92304845413264' viewBox='0 0 60 103.92304845413264' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 103.92304845413264l-30-17.32050807568877v-34.64101615137754l30-17.32050807568877l30 17.32050807568877v34.64101615137754zM30 86.60254037844386l20-11.547005383792518v-23.094010767585036l-20-11.547005383792518l-20 11.547005383792518v23.094010767585036z' fill='%23FFD600' fill-opacity='0.03' fill-rule='evenodd'/%3E%3C/svg%3E");
            z-index: 1;
        }

        /* EQUAÇÕES EMBUTIDAS NO FUNDO */
        .math-bg {
            position: absolute;
            font-family: 'Cambria Math', 'Times New Roman', serif;
            font-style: italic;
            z-index: 2;
            pointer-events: none;
            user-select: none;
            white-space: nowrap;
        }

        .math-yellow { color: var(--math-faded); }
        .math-white { color: var(--math-faded-white); }

        .eq1 { top: 5%; left: 5%; font-size: 6vw; transform: rotate(-5deg); }
        .eq2 { bottom: 10%; right: -2%; font-size: 8vw; transform: rotate(10deg); }
        .eq3 { top: 40%; left: -5%; font-size: 10vw; transform: rotate(-90deg); opacity: 0.08; }
        .eq4 { top: 20%; right: 10%; font-size: 4vw; transform: rotate(15deg); }
        .eq5 { bottom: -5%; left: 20%; font-size: 7vw; }
        .eq6 { top: 10%; left: 40%; font-size: 3vw; }
        .eq7 { bottom: 30%; right: 25%; font-size: 5vw; transform: rotate(-15deg); }

        /* ESTRUTURA PRINCIPAL DA CAPA */
        .cover-content {
            position: relative;
            z-index: 10;
            display: flex;
            height: 100%;
            width: 100%;
        }

        .left-col {
            flex: 1.3;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            padding: 6vw;
            background: linear-gradient(90deg, rgba(5,5,5,1) 65%, rgba(5,5,5,0) 100%);
        }

        .right-col {
            flex: 0.7;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* TIPOGRAFIA */
        .tagline {
            color: #fff;
            font-family: 'Fira Code', monospace;
            font-size: 1.1vw;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 20px;
            border-left: 4px solid var(--bee-yellow);
            padding-left: 15px;
        }

        h1 {
            color: var(--bee-yellow);
            font-size: 5.5vw; /* Ajustado de 6.5vw para comportar SPECTRAWAVE */
            font-weight: 900;
            line-height: 1;
            margin: 0 0 20px 0;
            text-transform: uppercase;
            text-shadow: 0 0 20px var(--bee-yellow-glow);
        }

        h1 span {
            color: #fff;
            display: block;
            font-size: 2.8vw; /* Ajustado de 4vw para comportar o texto maior na mesma linha */
            font-weight: 700;
            text-shadow: none;
            margin-top: 15px;
        }

        .author-box {
            margin-top: 40px;
            border-top: 1px solid #333;
            padding-top: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            width: 100%;
        }

        .author-box .name {
            color: #fff;
            font-size: 1.4vw;
            font-weight: 700;
        }

        /* BOTÃO INICIAR */
        .btn-iniciar {
            margin-top: 50px;
            padding: 18px 50px;
            background-color: var(--bee-yellow);
            color: var(--bg-dark);
            font-family: 'Fira Code', monospace;
            font-size: 1.4vw;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 0 20px var(--bee-yellow-glow);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-iniciar:hover {
            background-color: #fff;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.6);
            transform: translateY(-3px);
        }

        .btn-iniciar:active {
            transform: translateY(1px);
        }

        /* GRÁFICO CENTRAL SVG */
        .hero-graphic {
            position: absolute;
            right: 5vw;
            top: 50%;
            transform: translateY(-50%);
            width: 38vw;
            max-width: 600px;
            height: auto;
            filter: drop-shadow(0 0 15px var(--bee-yellow-glow));
        }

        /* Responsividade para telas menores */
        @media (max-width: 900px) {
            .cover-content { flex-direction: column; }
            .left-col { flex: 1; padding: 10vw; background: rgba(5,5,5,0.8); z-index: 2; }
            .right-col { position: absolute; width: 100%; height: 100%; z-index: 1; opacity: 0.4; }
            .hero-graphic { right: 50%; transform: translate(50%, -50%); width: 80vw; }
            .tagline { font-size: 3vw; }
            h1 { font-size: 10vw; }
            h1 span { font-size: 5vw; }
            .author-box .name { font-size: 4vw; }
            .btn-iniciar { font-size: 4vw; padding: 15px 40px; }
        }
    </style>
</head>
<body>

    <div class="slide">
        <div class="hex-bg"></div>

        <div class="math-bg math-yellow eq1">ℱ{f}(ω) = ∫ f(t) e^{-iωt} dt</div>
        <div class="math-bg math-white eq2">Δx Δp ≥ ℏ/2</div>
        <div class="math-bg math-yellow eq3">f(x) = (1/2π) ∫ F(k) e^{ikx} dk</div>
        <div class="math-bg math-white eq4">∇²E = μ₀ε₀(∂²E/∂t²)</div>
        <div class="math-bg math-yellow eq5">|ψ⟩ = ∫ φ(p)|p⟩ dp</div>
        <div class="math-bg math-white eq6">iℏ(∂Ψ/∂t) = ĤΨ</div>
        <div class="math-bg math-yellow eq7">δ(t) = (1/2π) ∫ e^{iωt} dω</div>

        <div class="cover-content">
            <div class="left-col">
                <div class="tagline">Oscilações e Ondas</div>
                <h1>SPECTRAWAVE<br><span>Análise e Criptografia</span></h1>
                
                <div class="author-box">
                    <div class="name">Senac Nações Unidas</div>
                </div>

                <button class="btn-iniciar" onclick="window.location.href='app.html'">Iniciar</button>
            </div>
            
            <div class="right-col">
                <svg class="hero-graphic" viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg">
                    <line x1="50" y1="350" x2="450" y2="350" stroke="#333" stroke-width="2" />
                    <line x1="50" y1="350" x2="150" y2="50" stroke="#333" stroke-width="2" />
                    <line x1="150" y1="50" x2="480" y2="50" stroke="#333" stroke-width="2" />
                    <line x1="450" y1="350" x2="450" y2="280" stroke="#333" stroke-width="2" />
                    
                    <text x="460" y="355" fill="#FFD600" font-family="Fira Code" font-size="14">Tempo (t)</text>
                    <text x="160" y="45" fill="#FFF" font-family="Fira Code" font-size="14">Frequência (ω)</text>

                    <path d="M 50 300 Q 80 200 120 300 T 190 300 T 260 300 T 330 300 T 400 300" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="4" />
                    
                    <line x1="90" y1="260" x2="170" y2="100" stroke="#FFD600" stroke-width="1" stroke-dasharray="4" opacity="0.5"/>
                    <line x1="150" y1="300" x2="230" y2="140" stroke="#FFD600" stroke-width="1" stroke-dasharray="4" opacity="0.5"/>
                    <line x1="230" y1="260" x2="310" y2="100" stroke="#FFD600" stroke-width="1" stroke-dasharray="4" opacity="0.5"/>

                    <path d="M 120 180 Q 150 150 180 180 T 240 180 T 300 180 T 360 180 T 420 180" fill="none" stroke="#FFD600" stroke-width="2" opacity="0.9"/>
                    <path d="M 150 120 Q 165 90 180 120 T 210 120 T 240 120 T 270 120 T 300 120 T 330 120 T 360 120 T 390 120 T 420 120" fill="none" stroke="#FFD600" stroke-width="1.5" opacity="0.7"/>
                    
                    <rect x="220" y="50" width="8" height="80" fill="#FFD600" />
                    <rect x="300" y="50" width="8" height="40" fill="#FFD600" opacity="0.7" />
                    <rect x="380" y="50" width="8" height="20" fill="#FFD600" opacity="0.5" />
                    
                    <circle cx="224" cy="50" r="6" fill="#FFF" />
                    <circle cx="304" cy="50" r="4" fill="#FFF" />
                    <circle cx="384" cy="50" r="3" fill="#FFF" />
                </svg>
            </div>
        </div>
    </div>

</body>
</html>
